server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve the pretty URLs used in the App Store listing (/privacy, /support)
    # as well as the explicit .html paths and the bare directory URLs.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Never serve repository metadata or other dotfiles. The image is built with
    # a .dockerignore that already keeps .git out of the context; this is a
    # second line of defence for anything that slips through.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
